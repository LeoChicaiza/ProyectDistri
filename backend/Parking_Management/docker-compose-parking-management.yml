services:
  parking-db:
    image: mysql:8.0
    container_name: parking-mysql
    restart: always
    environment:
      MYSQL_DATABASE: parking_management_db
      MYSQL_ROOT_PASSWORD: proot123
      MYSQL_USER: uroot
      MYSQL_PASSWORD: proot123
    ports:
      - "3306:3306"
    volumes:
      - parking_mysql_data:/var/lib/mysql
    networks:
      - parking-net

  availability-service:
    build:
      context: ./availability-service
      dockerfile: Dockerfile
    container_name: availability-service
    depends_on:
      - parking-db
    environment:
      DB_HOST: parking-mysql
      DB_PORT: 3306
      DB_NAME: parking_management_db
      DB_USER: uroot
      DB_PASSWORD: proot123
    ports:
      - "8007:8007"
    networks:
      - parking-net

  levels-floors-service:
    build:
      context: ./levels-floors-service
      dockerfile: Dockerfile
    container_name: levels-floors-service
    depends_on:
      - parking-db
    environment:
      DB_HOST: parking-mysql
      DB_PORT: 3306
      DB_NAME: parking_management_db
      DB_USER: uroot
      DB_PASSWORD: proot123
    ports:
      - "8008:8008"
    networks:
      - parking-net

  parking-lot-creation-service:
    build:
      context: ./parking-lot-creation-service
      dockerfile: Dockerfile
    container_name: parking-lot-creation-service
    depends_on:
      - parking-db
    environment:
      DB_HOST: parking-mysql
      DB_PORT: 3306
      DB_NAME: parking_management_db
      DB_USER: uroot
      DB_PASSWORD: proot123
    ports:
      - "8009:8009"
    networks:
      - parking-net

  parking-slots-service:
    build:
      context: ./parking-slots-service
      dockerfile: Dockerfile
    container_name: parking-slots-service
    depends_on:
      - parking-db
    environment:
      DB_HOST: parking-mysql
      DB_PORT: 3306
      DB_NAME: parking_management_db
      DB_USER: uroot
      DB_PASSWORD: proot123
    ports:
      - "8010:8010"
    networks:
      - parking-net

  slot-maintenance-service:
    build:
      context: ./slot-maintenance-service
      dockerfile: Dockerfile
    container_name: slot-maintenance-service
    depends_on:
      - parking-db
    environment:
      DB_HOST: parking-mysql
      DB_PORT: 3306
      DB_NAME: parking_management_db
      DB_USER: uroot
      DB_PASSWORD: proot123
    ports:
      - "8011:8011"
    networks:
      - parking-net

  zones-service:
    build:
      context: ./zones-service
      dockerfile: Dockerfile
    container_name: zones-service
    depends_on:
      - parking-db
    environment:
      DB_HOST: parking-mysql
      DB_PORT: 3306
      DB_NAME: parking_management_db
      DB_USER: uroot
      DB_PASSWORD: proot123
    ports:
      - "8012:8012"
    networks:
      - parking-net

volumes:
  parking_mysql_data:

networks:
  parking-net:
    driver: bridge

