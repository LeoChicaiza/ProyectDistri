version: '3.10'
services:
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "8000:8000"
    networks:
      - authentication_and_users_auth_net
      - parking_management_parking-net

networks:
  authentication_and_users_auth_net:
    external: true
  parking_management_parking-net:
    external: true




  

