events {}

http {
  # Upstreams
  upstream auth{
    server auth-service:8001; 
  }
  upstream access_control { 
    server access-control-service:8002; 
    }
  upstream sessions       { 
    server active-sessions-service:8003; 
    }
  upstream audit          { 
    server login-audit-service:5000; 
    }
  upstream recovery       { 
    server recovery-service:8005; 
    }
  upstream users          { 
    server user-management-service:8006; 
    }

  upstream availability   { 
    server availability-service:8007; 
    }
  upstream levels         { 
    server levels-floors-service:8008; 
    }
  upstream lot_creator    { 
    server parking-lot-creation-service:8009; 
    }
  upstream slots          {
     server parking-slots-service:8010; 
     }
  upstream maintenance    {
     server slot-maintenance-service:8011; 
     }
  upstream zones          { 
    server zones-service:8012; 
    }

  server {
    listen 8000;

    # ——— Auth domain ———
    location /auth/ {
      proxy_pass         http://auth;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;

    }

    location /access/ {
      proxy_pass         http://access_control;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /sessions/ {
      proxy_pass         http://sessions;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /audit/ {
      proxy_pass         http://audit;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /recovery/ {
      proxy_pass         http://recovery;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /users/ {
      proxy_pass         http://auth;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   Authorization     $http_authorization;
    }

    # ——— Parking management ———
    location /availability/ {
      proxy_pass         http://availability;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /levels/ {
      proxy_pass         http://levels;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /parking-lots/ {
      proxy_pass         http://lot_creator;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /slots/ {
      proxy_pass         http://slots;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /maintenance/ {
      proxy_pass         http://maintenance;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location /zones/ {
      proxy_pass         http://zones;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # ——— Healthcheck for gateway itself ———
    location = /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok"}';
    }

    # ——— Fallback ———
    location / {
      return 404 "Gateway: Path not found\n";
    }
  }
 }




